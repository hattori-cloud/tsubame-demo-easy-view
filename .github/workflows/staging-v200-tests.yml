name: V200 Staging Safety Tests

on:
  push:
    branches:
      - staging-v200-backend
      - post-audit-v200-prod-readiness
      - post-audit-v200-hardening-next

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tsubame_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tsubame_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tsubame_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run regression tests
        run: npm test

      - name: Apply and verify production PostgreSQL schema
        run: node scripts/verify-production-db-v200.js

      - name: Verify distributed login rate limiter
        run: node scripts/verify-login-rate-limit-v200.js

      - name: Verify production DB role separation
        run: node scripts/verify-db-role-v200.js

      - name: Verify transactional work-import lifecycle
        run: node scripts/verify-work-import-v200.js

      - name: Verify migration reconciliation
        env:
          MIGRATION_MANIFEST_PATH: tests/fixtures/migration-manifest-ci-v200.json
        run: node scripts/reconcile-production-migration-v200.js

      - name: Verify multi-user optimistic concurrency
        run: node scripts/verify-concurrency-v200.js

      - name: Backup and restore PostgreSQL
        run: |
          mkdir -p "$PWD/.ci-backup"
          docker run --rm --network host -e PGPASSWORD=postgres -v "$PWD/.ci-backup:/backup" postgres:16 \
            pg_dump -h 127.0.0.1 -U postgres -d tsubame_ci -Fc --no-owner --no-privileges -f /backup/tsubame.dump
          docker run --rm --network host -e PGPASSWORD=postgres postgres:16 \
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS tsubame_restore WITH (FORCE);" \
            -c "CREATE DATABASE tsubame_restore;"
          docker run --rm --network host -e PGPASSWORD=postgres -v "$PWD/.ci-backup:/backup" postgres:16 \
            pg_restore -h 127.0.0.1 -U postgres -d tsubame_restore --no-owner --no-privileges --exit-on-error /backup/tsubame.dump
          docker run --rm --network host -e PGPASSWORD=postgres -v "$PWD:/work" postgres:16 \
            psql -h 127.0.0.1 -U postgres -d tsubame_restore -v ON_ERROR_STOP=1 -f /work/docs/production-role-grants-v200.sql
          TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/tsubame_restore node scripts/verify-restored-db-v200.js

      - name: Verify external-audit regression cases
        run: node scripts/verify-audit-regressions-v200.js

      - name: Verify private document storage contract
        run: node scripts/verify-document-storage-contract-v200.js

      - name: Verify encrypted original backup restore contract
        run: node scripts/verify-document-backup-restore-v200.js
